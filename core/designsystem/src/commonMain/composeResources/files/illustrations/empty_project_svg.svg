    <g fill="none" stroke="#5A4A42" stroke-width="3.2">
      <path d="M140 188 L160 214 L156 257 L163 258"/>
      <path d="M128 197 L118 222 L124 257 L131 258"/>
      <path d="M152 172 L172 182 L184 194"/>
