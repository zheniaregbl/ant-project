<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 56 370 224" width="740" height="448">
  <!-- фон -->
  <path d="M60 250 C30 190 60 110 140 80 C220 50 330 70 365 140 C395 200 370 250 330 262 L80 262 Z" fill="#EEF1F4"/>
  <ellipse cx="225" cy="262" rx="170" ry="9" fill="#DDE2E8"/>

  <!-- листья справа -->
  <path d="M388 258 C392 235 398 222 406 212" fill="none" stroke="#4F7A55" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M396 232 C382 226 372 232 370 240 C382 243 391 240 396 232 Z" fill="#6F9C6E"/>
  <path d="M401 220 C404 206 396 196 388 196 C386 208 392 216 401 220 Z" fill="#86B07F"/>

  <!-- пунктирный контур будущего муравейника -->
  <g fill="none" stroke="#AEB8C3" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="7 7">
    <path d="M236 258 C240 204 272 170 306 168 C340 170 372 204 376 258"/>
    <path d="M290 258 C290 240 322 240 322 258"/>
  </g>

  <!-- флажок -->
