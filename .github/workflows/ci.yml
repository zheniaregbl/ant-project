name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - id: jvm
            name: Lint, tests, Android & Desktop builds
            os: ubuntu-latest
            tasks: >-
              ktlintCheck detekt
              allTests
              :androidApp:assembleDebug
              :desktopApp:assemble

          - id: ios
            name: iOS tests & framework
            os: macos-latest
            native: true
            tasks: >-
              iosSimulatorArm64Test
              :shared:linkDebugFrameworkIosSimulatorArm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Cache Kotlin/Native toolchain
        if: matrix.native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Run Gradle
        run: ./gradlew ${{ matrix.tasks }} --continue

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.id }}
          path: '**/build/reports/'