name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      # Один упавший job не отменяет остальные — сразу видно все проблемы
      fail-fast: false
      matrix:
        include:
          - id: lint
            name: Lint
            os: ubuntu-latest
            tasks: ktlintCheck detekt

          - id: test-jvm
            name: Tests (Desktop + Android)
            os: ubuntu-latest
            # Проверь имена: jvm("desktop") -> desktopTest, jvm() -> jvmTest
            tasks: desktopTest testDebugUnitTest

          - id: test-ios
            name: Tests (iOS)
            os: macos-latest
            native: true
            tasks: iosSimulatorArm64Test

          - id: build-android
            name: Build Android
            os: ubuntu-latest
            tasks: :androidApp:assembleDebug

          - id: build-desktop
            name: Build Desktop
            os: ubuntu-latest
            tasks: :desktopApp:assemble

          - id: build-ios
            name: Build iOS framework
            os: macos-latest
            native: true
            tasks: :shared:linkDebugFrameworkIosSimulatorArm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Кэш Gradle пишется только с master, PR-ы его читают
      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        if: matrix.native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Run ${{ matrix.tasks }}
        run: ./gradlew ${{ matrix.tasks }}

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.id }}
          path: '**/build/reports/'